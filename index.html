                <div className="legend"><span><i style={{ background: 'var(--sun2)' }} />Pagi</span><span><i style={{ background: 'var(--mo1)' }} />Malam</span><span><i style={{ background: 'var(--off)' }} />Off/Rest</span>{ui.showOt && <span>Bar putih = OT</span>}</div>
              </> : <>
                <div className="card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}><b>Kitaran gaji</b><input type="month" value={am} onChange={e => e.target.value && setAm(e.target.value)} style={{ width: 'auto' }} /></div>
                {Nav}
                <div className="card">
                  <div className="row"><span>Gaji asas</span><b>{RM(n(s.baseSalary))}</b></div>
                  <div className="row clk" onClick={() => setSub({ t: 'bd', k: 'al' })}><span>Elaun ({RM(S.ex)} tambahan) ›</span><b style={{ color: 'var(--ok)' }}>{RM(S.al)}</b></div>
                  <div className="row clk" onClick={() => setSub({ t: 'bd', k: 'ot' })}><span>OT ({S.oh} jam @ {RM(S.br)}/j) ›</span><b style={{ color: 'var(--ac)' }}>{RM(S.ot)}</b></div>
                  <div className="row"><span>Gaji kasar</span><b>{RM(S.gross)}</b></div>
                  <div className="row"><span>Potongan</span><b style={{ color: 'var(--bad)' }}>− {RM(S.ded)}</b></div>
                  <div className="row big"><span>Gaji bersih</span><b>{RM(S.net)}</b></div>
                  <button className="btn" onClick={openSlip}>Kongsi slip gaji</button>
                </div>
                <div className="card"><table><thead><tr><th>Tarikh</th><th>Jenis</th><th>Syif</th><th>OT</th><th>RM</th></tr></thead><tbody>
                  {cyc.map(d => { const r = rec[d.s] || {}, e = dayEarn(r, s, S.br); return <tr key={d.s}><td>{p2(d.dt.getDate())}/{p2(d.dt.getMonth() + 1)}</td><td>{r.dayType || '-'}</td><td>{r.shift || '-'}</td><td>{r.ot || '-'}</td><td>{e ? Math.round(e) : '-'}</td></tr>; })}
                </tbody></table></div>
              </>}
            </main>

            <div className="tab">
              <button className={view === 'cal' ? 'on' : ''} onClick={() => setView('cal')}><Ico d={P.cal} />Kalendar</button>
              <button className={view === 'sal' ? 'on' : ''} onClick={() => setView('sal')}><Ico d={P.cash} />Kira Gaji</button>
            </div>

            {modal === 'day' && dm && (() => {
              const [y, m, dd] = dm.k.split('-').map(Number), dn = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'][new Date(y, m - 1, dd).getDay()];
              return (
                <Sheet title={`${dn}, ${dd} ${MON[m - 1]} ${y}`} onClose={() => setModal(null)}>
                  <label>Jenis hari</label>
                  <select value={dm.d.dayType} onChange={e => dmChange('dayType', e.target.value)}>{s.dayTypes.map(t => <option key={t.id} value={t.name}>{t.name}</option>)}</select>
                  <div className="g2">
                    <div><label>Syif</label><select value={dm.d.shift} onChange={e => dmChange('shift', e.target.value)}><option value="">Tiada</option>{SHIFTS.map(o => <option key={o}>{o}</option>)}</select></div>
                    <Num label="OT (jam)" step="0.5" value={dm.d.ot} onChange={e => dmChange('ot', e.target.value)} />
                  </div>
                  <label>Nota</label><input type="text" value={dm.d.note} onChange={e => dmChange('note', e.target.value)} />
                  <button className="btn" onClick={saveDay}>Simpan</button>
                  <button className="btn g" onClick={copyPrev}>Salin dari hari sebelumnya</button>
                  <button className="btn r" onClick={delDay}>Padam rekod</button>
                </Sheet>
              );
            })()}

            {modal === 'pat' && (
              <Sheet title="Jana corak automatik" onClose={() => setModal(null)}>
                <label>Dari tarikh</label><input type="date" value={pat.start} onChange={e => setPat({ ...pat, start: e.target.value })} />
                <label>Corak (M, N, OFF, REST)</label><textarea rows="2" value={pat.pattern} onChange={e => setPat({ ...pat, pattern: e.target.value })} />
                <label>Sehingga tarikh</label><input type="date" value={pat.end} onChange={e => setPat({ ...pat, end: e.target.value })} />
                <p style={{ color: 'var(--mut)', fontSize: 12 }}>Rekod sedia ada dalam julat ini akan diganti.</p>
                <button className="btn" onClick={genPat}>Jana sekarang</button>
              </Sheet>
            )}

            {modal === 'slip' && (
              <Sheet title="Slip gaji" onClose={() => setModal(null)}>
                <img className="slip" src={slip} alt="Slip gaji" />
                <button className="btn" onClick={shareSlip}>Kongsi</button>
                <p style={{ color: 'var(--mut)', fontSize: 12, textAlign: 'center' }}>Jika butang tidak berfungsi, tekan lama imej untuk simpan.</p>
              </Sheet>
            )}

            {modal === 'set' && (
              <Sheet title={`Tetapan · ${am}`} onClose={() => setModal(null)}>
                <p style={{ color: 'var(--mut)', fontSize: 12, margin: 0 }}>Tetapan ini untuk kitaran {am} dan diwarisi bulan seterusnya.</p>
                <h4>Warna aksen</h4>
                <div className="sw">{['#f5b73b', '#34d399', '#22d3ee', '#f472b6', '#a78bfa'].map(c => <button key={c} className={ui.acc === c ? 'on' : ''} style={{ background: c }} aria-label={'Warna ' + c} onClick={() => setUi({ ...ui, acc: c })} />)}</div>

                <h4>Paparan kalendar</h4>
                <label>Julat</label>
                <div className="seg">
                  <button className={ui.calendarMode !== 'month' ? 'on' : ''} onClick={() => setUi({ ...ui, calendarMode: 'cycle' })}>Ikut kitaran</button>
                  <button className={ui.calendarMode === 'month' ? 'on' : ''} onClick={() => setUi({ ...ui, calendarMode: 'month' })}>Ikut 1hb</button>
                </div>
                <p style={{ color: 'var(--mut)', fontSize: 12, margin: '8px 0 0' }}>Pilihan paparan sahaja. Kiraan gaji tetap mengikut kitaran Mula/Tamat di bawah.</p>
                <label>Gaya syif</label>
                <div className="seg">
                  <button className={ui.shiftDisplay !== 'text' ? 'on' : ''} onClick={() => setUi({ ...ui, shiftDisplay: 'icon' })}>Ikon</button>
                  <button className={ui.shiftDisplay === 'text' ? 'on' : ''} onClick={() => setUi({ ...ui, shiftDisplay: 'text' })}>Huruf</button>
                </div>
                <label style={{ display: 'flex', gap: 8, alignItems: 'center', marginTop: 10 }}><input type="checkbox" style={{ width: 'auto' }} checked={ui.netEnabled !== false} onChange={e => setUi({ ...ui, netEnabled: e.target.checked })} />Anggaran gaji bersih</label>
                <label style={{ display: 'flex', gap: 8, alignItems: 'center', marginTop: 8 }}><input type="checkbox" style={{ width: 'auto' }} checked={ui.showUpcomingNotes !== false} onChange={e => setUi({ ...ui, showUpcomingNotes: e.target.checked })} />Nota akan datang</label>
                <label>Papar nota sebelum (hari)</label>
                <input type="number" min="0" max="30" value={ui.noteReminderDays} onChange={e => setUi({ ...ui, noteReminderDays: Math.max(0, Math.min(30, parseInt(e.target.value, 10) || 0)) })} />
                <p style={{ color: 'var(--mut)', fontSize: 12, margin: '8px 0 0' }}>Nota dengan tarikh dalam julat ini akan dipaparkan pada kalendar.</p>

                <h4>Gaji dan kitaran</h4>
                <label>Nama jadual</label><input value={s.shiftName || ''} onChange={e => setF('shiftName', e.target.value)} />
                <div className="g2">
                  <Num label="Gaji asas (RM)" placeholder="0" value={s.baseSalary || ''} onChange={e => setF('baseSalary', e.target.value)} />
                  <Num label={n(s.baseSalary) >= 4000 ? 'Kadar sejam' : 'Kadar sejam (auto)'} readOnly={n(s.baseSalary) < 4000} value={n(s.baseSalary) >= 4000 ? s.customHourlyRate : (n(s.baseSalary) / 26 / 8).toFixed(2)} onChange={e => setF('customHourlyRate', e.target.value)} />
                  <Num label="Mula (hb)" value={s.cycleStart} onChange={e => setF('cycleStart', e.target.value)} />
                  <Num label="Tamat (hb)" value={s.cycleEnd} onChange={e => setF('cycleEnd', e.target.value)} />
                </div>

                <h4>Jenis hari dan gandaan OT</h4>
                <button className="btn g" onClick={() => mod(c => c.dayTypes.push({ id: Date.now(), name: 'Baru', isTiered: false, rate: 1.5, tier1Hours: 8, tier1Rate: 2, tier2Rate: 3 }))}>Tambah jenis hari</button>
                {s.dayTypes.map(t => (
                  <div className="card" key={t.id} style={{ padding: 10, margin: '8px 0' }}>
                    <div className="li" style={{ gridTemplateColumns: '1fr 34px' }}>
                      <input value={t.name} onChange={e => dtUpd(t.id, 'name', e.target.value)} />
                      <button className="ib" style={{ margin: 0, width: 34 }} aria-label="Padam" onClick={() => ask('Pasti mahu padam jenis hari ini?', () => mod(c => { c.dayTypes = c.dayTypes.filter(z => z.id !== t.id); }))}><Ico d={P.trash} /></button>
                    </div>
                    <label style={{ display: 'flex', gap: 8, alignItems: 'center' }}><input type="checkbox" style={{ width: 'auto' }} checked={!!t.isTiered} onChange={e => dtUpd(t.id, 'isTiered', e.target.checked)} />Kadar bertingkat</label>
                    {t.isTiered
                      ? <div className="g3"><Num label="Jam pertama" value={t.tier1Hours} onChange={e => dtUpd(t.id, 'tier1Hours', e.target.value)} /><Num label="Kadar ×" step="0.5" value={t.tier1Rate} onChange={e => dtUpd(t.id, 'tier1Rate', e.target.value)} /><Num label="Baki ×" step="0.5" value={t.tier2Rate} onChange={e => dtUpd(t.id, 'tier2Rate', e.target.value)} /></div>
                      : <Num label="Kadar × asas" step="0.5" value={t.rate} onChange={e => dtUpd(t.id, 'rate', e.target.value)} />}
                  </div>
                ))}

                <h4>Elaun syif (RM)</h4>
                <div className="g3">{Object.keys(DEF.allowances).map(k => <Num key={k} label={k} value={s.allowances[k]} onChange={e => mod(c => { c.allowances[k] = e.target.value; })} />)}</div>
                <Num label="Elaun meal (syif N)" value={s.mealAllowance} onChange={e => setF('mealAllowance', e.target.value)} />

                {[['customAllowances', 'Elaun tambahan', 'Tambah elaun', 'Pasti mahu padam elaun tambahan ini?'], ['deductions', 'Potongan', 'Tambah potongan', 'Pasti mahu padam potongan ini?']].map(([key, ttl, addL, msg]) => (
                  <div key={key}>
                    <h4>{ttl}</h4>
                    {s[key].map(x => (
                      <div className="li" key={x.id}>
                        <input value={x.name} placeholder="Nama" onChange={e => lstUpd(key, x.id, 'name', e.target.value)} />
                        <input type="number" inputMode="decimal" value={x.amount} placeholder="RM" onChange={e => lstUpd(key, x.id, 'amount', e.target.value)} />
                        <button className="ib" style={{ margin: 0, width: 34 }} aria-label="Padam" onClick={() => lstDel(key, x.id, msg)}><Ico d={P.trash} /></button>
                      </div>
                    ))}
                    <button className="btn g" onClick={() => mod(c => c[key].push({ id: Date.now(), name: '', amount: '' }))}>{addL}</button>
                  </div>
                ))}

                <h4>Simpan dan panggil data</h4>
                <p style={{ color: 'var(--mut)', fontSize: 12, margin: 0 }}>Data disimpan automatik dalam peranti masing-masing. Simpan satu salinan sandaran untuk dipanggil semula bila perlu.</p>
                <div className="g2">
                  <button className="btn g" onClick={saveSlot}>Simpan data</button>
                  <button className="btn g" onClick={restoreSlot}>Pulih data</button>
                </div>
                {lastBackup && <p style={{ color: 'var(--mut)', fontSize: 12, margin: '8px 0 0' }}>Sandaran terakhir: {new Date(lastBackup).toLocaleString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>}
                <div className="g2" style={{ marginTop: 8 }}>
                  <button className="btn g" onClick={exportFile}>Export fail</button>
                  <button className="btn g" onClick={() => fileRef.current && fileRef.current.click()}>Import fail</button>
                </div>
                <button className="btn r" style={{ marginTop: 10 }} onClick={resetAllData}>Kosongkan semua data</button>
                <input type="file" ref={fileRef} accept=".json" hidden onChange={importFile} />
              </Sheet>
            )}

            {sub && sub.t === 'cf' && (
              <Sheet top title="Pasti?" onClose={() => setSub(null)}>
                <p>{sub.m}</p>
                <div className="g2"><button className="btn g" onClick={() => setSub(null)}>Tidak</button><button className={sub.okCls || 'btn r'} onClick={() => { const f = sub.fn; setSub(null); f && f(); }}>{sub.ok || 'Ya, padam'}</button></div>
              </Sheet>
            )}
            {sub && sub.t === 'bd' && sub.k === 'ot' && (
              <Sheet top title="Perincian OT" onClose={() => setSub(null)}>
                <div className="row"><span>Kadar asas/jam</span><b>{RM(S.br)}</b></div>
                {Object.keys(S.bd).sort().map(k => <div className="row" key={k}><span>{k}x ({S.bd[k].h}j)</span><b>{RM(S.bd[k].a)}</b></div>)}
                {!Object.keys(S.bd).length && <p style={{ color: 'var(--mut)' }}>Tiada rekod OT bulan ini.</p>}
                <div className="row big"><span>Jumlah OT</span><b>{RM(S.ot)}</b></div>
              </Sheet>
            )}
            {sub && sub.t === 'bd' && sub.k === 'al' && (
              <Sheet top title="Perincian elaun" onClose={() => setSub(null)}>
                <h4>Elaun syif dan meal</h4>
                {Object.keys(s.allowances).filter(k => S.sc[k]).map(k => <div className="row" key={k}><span>Syif {k} ({S.sc[k]}×{RM(n(s.allowances[k]))})</span><b>{RM(S.sc[k] * n(s.allowances[k]))}</b></div>)}
                {S.mn > 0 && <div className="row"><span>Meal N ({S.mn}×{RM(n(s.mealAllowance))})</span><b>{RM(S.mn * n(s.mealAllowance))}</b></div>}
                {!Object.keys(S.sc).length && <p style={{ color: 'var(--mut)' }}>Tiada.</p>}
                {s.customAllowances.some(x => n(x.amount)) && <><h4>Elaun tambahan</h4>{s.customAllowances.filter(x => n(x.amount)).map(x => <div className="row" key={x.id}><span>{x.name}</span><b>{RM(n(x.amount))}</b></div>)}</>}
                <div className="row big"><span>Jumlah elaun</span><b>{RM(S.al)}</b></div>
              </Sheet>
            )}

            {toastMsg && <div className="toast">{toastMsg}</div>}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
